name: fuzz-weekly

# Monthly long-form fuzz of the analyzer parsers. The full `fuzz` job in
# go-verify.yml only runs each target for 2s and exists to catch syntactic
# regressions; this workflow exists to find actual new failing inputs.
# Findings are uploaded as artifacts so they can be committed into the corpus
# by hand.
on:
  workflow_call:
    inputs:
      fuzztime:
        description: 'Per-target fuzz duration (Go duration string, e.g. 10m, 30m, 1h)'
        required: false
        default: '10m'
        type: string
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzParseAnalysisResponse
          - FuzzDecodeAnalyzerMessageContent
    env:
      FUZZTIME: ${{ inputs.fuzztime || '10m' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        run: |
          set -o pipefail
          go test ./internal/service/analyzer \
            -run='^$' \
            -fuzz="^${{ matrix.target }}$" \
            -fuzztime="${FUZZTIME}" \
            -v 2>&1 | tee fuzz-${{ matrix.target }}.log

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: |
            internal/service/analyzer/testdata/fuzz/${{ matrix.target }}/
            fuzz-${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-log-${{ matrix.target }}
          path: fuzz-${{ matrix.target }}.log
          if-no-files-found: ignore
          retention-days: 14
