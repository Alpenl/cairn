name: lint

on:
  workflow_call:
    inputs:
      profile:
        description: 'Lint profile: quick, full, or security'
        required: true
        type: string

permissions:
  contents: read

jobs:
  actionlint:
    if: ${{ inputs.profile == 'quick' || inputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GitHub Actions workflows
        run: make actionlint

  golangci:
    if: ${{ inputs.profile == 'quick' || inputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        run: make lint

  vuln:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'security' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # 不用 golang/govulncheck-action：它内部又跑一次 actions/checkout，
      # 与外层 checkout 的 auth header 冲突 → "remote: Duplicate header:
      # Authorization" → fetch 400。上游 action 自 2024-10 后未维护。
      # 直接 go install + 跑命令，行为完全等价，少一个间接依赖。
      # 钉具体 tag 而不是 @latest：跟仓库整体 SHA-pin 卫生准则保持一致
      # （c277dea 已经把 27 个 GitHub Action 全部钉 SHA），避免 govulncheck
      # 上游某次 release 误报激增直接拉红 CI gate。tag 升级由 dependabot
      # gomod ecosystem 监控。
      - name: Run govulncheck
        run: make vuln
