name: reader-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      # pnpm must be installed before setup-node so setup-node's pnpm cache can
      # resolve the store. Version comes from the root package.json's
      # packageManager field — no version is pinned twice.
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit through the repository gate so CI uses the official advisory
      # registry and also proves ignoreGhsas remains empty. Current vulnerable
      # transitive versions are fixed through package overrides; no advisory is
      # muted.
      - name: Audit dependencies
        run: pnpm audit:ci

      - name: Check generated API contract
        run: pnpm --filter webtag-reader api:check

      # Consumer typechecks include DOM libraries. Run the shared package's
      # own tsconfig so accidental browser globals cannot enter its API.
      - name: Typecheck shared API package (no DOM)
        run: pnpm api:typecheck

      # ESLint check mode (no --fix), --max-warnings 0 per package.json script.
      - name: Lint
        run: pnpm --filter webtag-reader lint

      - name: Typecheck
        run: pnpm --filter webtag-reader typecheck

      - name: Test
        run: pnpm --filter webtag-reader test

      # 装 chrome 而不只是 chromium：原生 dialog 关闭后，chromium 构建（含
      # headless shell）不把焦点还给触发它的按钮，document.activeElement 退回
      # <body>，wp26 的键盘删除确认用例因此只在 CI 上失败。playwright.config.ts
      # 在找不到系统 Chrome 时会退到 channel: 'chrome'，这一步保证它存在。
      - name: Install Playwright Chrome
        run: pnpm --filter webtag-reader exec playwright install --with-deps chromium chrome

      # Real Chromium is required for the identity epoch and IndexedDB
      # transaction fences; jsdom/fake-indexeddb cannot prove browser timing.
      - name: Browser identity and storage tests
        run: pnpm --filter webtag-reader test:browser

      # Build last: validates the production tsc -b + vite build pipeline.
      - name: Build
        run: pnpm --filter webtag-reader build

      # Upload the dist/ bundle so a CI run's output is downloadable for
      # debugging (e.g. inspecting the generated assets).
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reader-dist
          path: reader/dist
          if-no-files-found: error
          retention-days: 7
