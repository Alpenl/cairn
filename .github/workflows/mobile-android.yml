name: mobile-android

on:
  # PR 上由 ci.yml 按路径过滤后调用，这里不再自带 pull_request 触发，否则同一个 PR
  # 会跑两遍（一遍自触发、一遍经 ci.yml），且自触发的那遍不计入 gate 汇总。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate shared fixtures
        run: |
          python3 mobile/shared/fixtures/validate.py
          python3 mobile/shared/fixtures/compare.py

      - name: Run Mobile static and wire gates
        run: |
          python3 scripts/mobile-x1-check.py
          python3 scripts/mobile-wire-smoke.py

      - name: Verify Android dependency metadata
        working-directory: mobile/android
        run: ./gradlew --no-daemon --dependency-verification strict help

      - name: Run Android fast build gates
        run: ./mobile/android/gradlew -p mobile/android --no-daemon --dependency-verification strict testDebugUnitTest assembleDebug lintDebug compileDebugAndroidTestKotlin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./mobile/android/gradlew -p mobile/android --no-daemon --dependency-verification strict connectedDebugAndroidTest

      - name: Check whitespace and signing files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e mobile/android/local.properties
          ! rg --files mobile -g '*.p12' -g '*.mobileprovision' -g '*.jks' -g '*.keystore'

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: webtag-share-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
