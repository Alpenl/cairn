name: dbintegration

# The suite starts its own pgvector/PostgreSQL container with testcontainers,
# applies the production migrations, and exercises behavior mocks cannot model.
on:
  workflow_call:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/dbintegration/go.sum

      - name: Run dbintegration tests
        shell: bash
        run: make test-dbintegration-required 2>&1 | tee /tmp/dbintegration.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dbintegration-logs
          path: /tmp/dbintegration.log
          if-no-files-found: ignore
          retention-days: 14
