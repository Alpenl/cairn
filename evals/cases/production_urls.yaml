# Public URLs currently represented in the production library. This corpus
# exists to catch summary readability regressions against real user content.
# Run with the production URL-direct path:
#   go run ./cmd/eval run --case evals/cases/production_urls.yaml

schema: webtag.eval/v1

cases:
  - id: production_github_daily_status
    url: https://x.com/GitHub_Daily/status/2073708506319098344
    description: "GitHub Daily X post"
    notes: "X posts use the dedicated social profile; the summary must not expand into a report."
    content_type: article
    expected:
      must_include:
        - A股
        - 回测
      nice_to_have:
        - 量化交易
        - 选股
        - 自托管
      must_not_include:
        - 技术
        - 互联网
        - 人工智能
      summary:
        must_include: [A股, 回测, 自托管]

  - id: production_good_api_design
    url: https://www.seangoedecke.com/good-api-design/
    description: "Sean Goedecke on practical API design"
    notes: "Long article: the summary must retain recommendations distributed across later sections."
    content_type: article
    expected:
      must_include:
        - API
        - 接口设计
      nice_to_have:
        - 向后兼容
        - 版本管理
        - 幂等性
      must_not_include:
        - 技术
        - 互联网
        - REST
        - GraphQL
        - 用户体验
      summary:
        must_include: [幂等, 分页]
        must_include_any: [向后兼容, 不破坏用户空间, 不破坏用户, 避免打破用户空间, 避免破坏用户]
        must_not_include: [破用户空间, 构建Twilio]

  - id: production_ruanyf_weekly_402
    url: https://github.com/ruanyf/weekly/blob/master/docs/issue-402.md
    description: "科技爱好者周刊第 402 期文档"
    notes: "Composite newsletter: represent the lead story and the breadth of the complete issue."
    content_type: listing
    expected:
      must_include:
        - 科技周刊
        - AI
      nice_to_have:
        - 短篇小说
        - 科技动态
        - 开发工具
      must_not_include:
        - 技术
        - 互联网
        - Ruanyf
        - AI职场
      summary:
        must_include: [短篇, AI, 工具]
        must_include_any: [科技动态, 科技新闻, 科技资讯]
        must_not_include: [创始人, 虚拟公司]

  - id: production_go_error_syntax
    url: https://go.dev/blog/error-syntax
    description: "Go blog post about error-handling syntax"
    notes: "The principal decision and its temporal qualifier must survive both summary and title generation."
    content_type: article
    expected:
      must_include:
        - Go
        - 错误处理
      nice_to_have:
        - 语法设计
        - Go提案
        - 社区共识
      must_not_include:
        - 技术
        - 编程
      summary:
        must_include: [未来, 错误处理, 语法]
        must_include_any: [决定, 暂缓, 停止推进]
      title:
        must_include_any: [暂缓, 暂不, 可预见]
        must_not_include: [停止引入]
