# WebTag eval seed cases.
#
# Edit / extend this file to evaluate fetcher + prompt + model
# combinations against real URLs. The IDs are global across all case
# files in evals/cases/, so keep them descriptive.
#
# Run:
#   go run ./cmd/eval run --case evals/cases/seed.yaml
#
# Each case's `expected` block is what the rule-based scorer uses to
# turn the LLM output into a 0-1 number. The lists are intentionally
# small — a typical case lists 1-2 must_include, 2-4 nice_to_have,
# and 3-5 must_not_include red flags. Bloating any list dilutes the
# signal and makes the score harder to interpret.

schema: webtag.eval/v1

cases:
  - id: zhihu_rag_article
    url: https://zhuanlan.zhihu.com/p/1949099058883985720
    description: "知乎讲腾讯 ima + WeKnora RAG 的长文"
    notes: "此前生产 prompt 经常打成 '技术' / 'AI' / '人工智能' 这类宽泛 tag。验证 prompt 修改后是否能产出具体产品名。"
    content_type: article
    expected:
      must_include:
        - RAG
      nice_to_have:
        - 腾讯
        - WeKnora
        - ima
        - 知识库
      must_not_include:
        - 技术
        - 互联网
        - 人工智能
        - 大语言模型

  - id: wechat_ima_article
    url: https://mp.weixin.qq.com/s/1n1JUrzxnHWwbXuk5vhXkA
    description: "腾讯 ima 公众号介绍文章"
    notes: "公众号有反爬，验证 wechat fetcher 是否能拿到正文 + tag 是否提到 ima。"
    content_type: article
    expected:
      must_include:
        - ima
      nice_to_have:
        - 腾讯
        - 知识库
        - AI
      must_not_include:
        - 技术
        - 互联网
        - 人工智能

  - id: github_weknora_repo
    url: https://github.com/Tencent/WeKnora
    description: "腾讯开源的知识库框架 WeKnora 仓库主页"
    notes: "验证 github fetcher 是否拿到 repo description + tag 是否正确"
    content_type: article
    expected:
      must_include:
        - WeKnora
      nice_to_have:
        - 腾讯
        - 知识库
        - RAG
      must_not_include:
        - 技术
        - GitHub
        - 开源
