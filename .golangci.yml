version: "2"
run:
  timeout: 5m
linters:
  default: none
  # 启用的 linter 分两类：
  #   - 第一波（v0）：errcheck/govet/ineffassign/staticcheck/unused
  #   - 第二波（M5 errsafe 漂移防御）：bodyclose/errorlint/gocyclo/gocritic/
  #     misspell/nilerr/gosec
  # depguard 只守住后端层级方向，避免业务/持久层重新依赖 HTTP 适配层。
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - bodyclose    # HTTP response body 未关闭，errsafe 漂移高风险点
    - errorlint    # %v→%w wrap 漂移；err == ErrXxx 应改 errors.Is
    - gocyclo      # 复杂度阈值 15，超出需 //nolint:gocyclo // reason
    - gocritic     # 常见反模式默认 checker
    - misspell     # 英文拼写
    - nilerr       # return nil 但 err 非空的疑似 bug
    - gosec        # 安全（硬编码 secret、zip slip 等）
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]
    errcheck:
      # `defer resp.Body.Close()` is the canonical Go idiom; (io.Closer).Close
      # covers every Close() call since io.ReadCloser embeds io.Closer.
      exclude-functions:
        - (io.Closer).Close
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        backend-layer-boundary:
          files:
            - "internal/service/*.go"
            - "internal/service/**/*.go"
            - "**/internal/service/*.go"
            - "**/internal/service/**/*.go"
            - "internal/repository/*.go"
            - "internal/repository/**/*.go"
            - "**/internal/repository/*.go"
            - "**/internal/repository/**/*.go"
            - "internal/worker/*.go"
            - "internal/worker/**/*.go"
            - "**/internal/worker/*.go"
            - "**/internal/worker/**/*.go"
            - "internal/feed/*.go"
            - "internal/feed/**/*.go"
            - "**/internal/feed/*.go"
            - "**/internal/feed/**/*.go"
            - "internal/app/durablework/*.go"
            - "internal/app/durablework/**/*.go"
            - "**/internal/app/durablework/*.go"
            - "**/internal/app/durablework/**/*.go"
            - "!$test"
          deny:
            - pkg: "webtag/internal/handler"
              desc: lower backend layers must not depend on HTTP handlers
            - pkg: "webtag/internal/middleware"
              desc: middleware belongs to HTTP assembly
            - pkg: "webtag/internal/httperr"
              desc: use internal/problem below handler; httperr is the HTTP adapter
    gosec:
      # G104：unhandled errors 已经由 errcheck 负责，重复报噪音大
      # G404：math/rand 用于非加密场景（jitter、采样），项目内已有判断
      excludes:
        - G104
        - G404
  exclusions:
    rules:
      # 测试文件：允许忽略 errcheck、宽松复杂度、宽松 gosec
      - path: _test\.go
        linters: [errcheck, gocyclo, gosec, bodyclose]
      # test/dbintegration：独立 sub-module 中的测试基础设施，同上
      - path: test/dbintegration/
        linters: [errcheck, gocyclo, gosec, bodyclose, errorlint, gocritic]
formatters:
  # 暂不启用 gofumpt / goimports：本仓存量代码风格混合 gofmt（标准）和
  # 部分手写格式，一次性 gofumpt-walk 会引入大量与本 PR 无关的 reformat
  # diff，违反"小步迭代"原则；留待后续单独 PR 做仓库级风格统一。
  enable:
    - gofmt
