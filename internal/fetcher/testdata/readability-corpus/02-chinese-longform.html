<!doctype html><html lang="zh-CN"><head><title>把后台任务做成可恢复的流程</title><meta name="author" content="林舟"><meta name="description" content="从状态、事务和保留策略三个方面讨论后台任务。"><meta property="og:site_name" content="工程札记"></head><body><nav>首页 专栏 关于</nav><article><h1>把后台任务做成可恢复的流程</h1><p>一个可靠的后台任务，不只是能够进入队列。系统还要明确记录任务属于哪个租户、当前是哪一次尝试，以及业务对象是否仍然等待这次结果。</p><p>数据库状态和队列写入应当由同一个事务所有者协调。这样，无论进程在提交前还是提交后退出，重试都不会制造重复的有效状态转换。</p><p>终态记录可以清理，但清理窗口必须覆盖检测延迟、调和周期和最长恢复停机时间。监控还要同时观察终态数量、最老记录年龄和表索引体积。</p><p>这些约束写进测试和运行手册以后，值班人员面对缺失任务时不再需要猜测，系统也能在有限时间内收敛到明确结果。</p></article><aside>热门文章 推荐阅读</aside></body></html>
