<!doctype html><html lang="ja"><head><title>キャッシュと整合性を両立する設計</title><meta name="author" content="佐藤ユキ"><meta name="description" content="分散した読み取りキャッシュを安全に更新する方法。"><meta property="og:site_name" content="技術ジャーナル"></head><body><main><article><h1>キャッシュと整合性を両立する設計</h1><p>読み取りを高速化するためのキャッシュは、更新の順序を明確にしなければ古い結果を長く残してしまいます。まず、どの変更が世代を進めるのかを一つの場所で定義します。</p><p>次に、複数のプロセスが同じデータを見る場合でも、ローカルな通知だけに依存しない仕組みを用意します。共有された世代番号を比較すれば、取りこぼした通知があっても次の読み取りで回復できます。</p><p>最後に、失敗時の挙動をテストします。更新前、更新中、更新後のそれぞれで停止させ、古い値が新しい値を上書きしないことを確認します。</p></article></main><footer>技術ジャーナル</footer></body></html>
