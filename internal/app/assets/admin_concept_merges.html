<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebTag · Concept Merge Review</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #222; }
  .container { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .toolbar button { padding: 8px 16px; background: #fff; color: #222; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s; }
  .toolbar button:hover { background: #f0f0f0; border-color: #bbb; }
  .toolbar button:disabled { color: #aaa; cursor: not-allowed; }
  .count-badge { font-size: 12px; color: #888; padding: 4px 10px; background: #e8e8e8; border-radius: 10px; }
  #status-line { margin-left: auto; font-size: 12px; color: #888; }
  #status-line.ok { color: #2a7a2a; }
  #status-line.err { color: #c0392b; }

  .proposals { display: flex; flex-direction: column; gap: 10px; }
  .proposal { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px 16px; }
  .proposal-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #888; }
  .score-pill { padding: 2px 8px; background: #eef5fc; color: #1561a5; border-radius: 10px; font-weight: 600; font-size: 11px; }
  .reason { flex: 1; font-style: italic; color: #555; }
  .pair { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
  .side { background: #fafafa; border: 1px solid #efefef; border-radius: 8px; padding: 10px 12px; }
  .side.winner { border-color: #2a7a2a; background: #f0f8f0; }
  .side .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .side .name { font-size: 15px; font-weight: 600; color: #222; word-break: break-word; }
  .side .meta { font-size: 11px; color: #999; margin-top: 4px; font-family: ui-monospace, "SF Mono", monospace; }
  .arrow { text-align: center; font-size: 18px; color: #ccc; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .actions button { padding: 7px 14px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .approve { background: #2a7a2a; color: #fff; }
  .approve:hover { background: #1f6a1f; }
  .reject { background: #fff; color: #c0392b; border: 1px solid #e6c4be; }
  .reject:hover { background: #fbecea; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .empty { padding: 60px 0; text-align: center; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>Concept Merge Review</h1>
  <div class="subtitle">LLM 判定可能同义的 tag 对会在此排队等待人工确认。批准会合并 concept、转移所有 link 与 alias；拒绝只标记不处理。</div>
  <div class="toolbar">
    <button id="refresh">刷新</button>
    <span class="count-badge"><span id="count">0</span> 条待审</span>
    <span id="status-line"></span>
  </div>
  <div id="proposals" class="proposals"></div>
</div>

<script>
const ENDPOINT = "/api/admin/concept-merges";

const els = {
  refresh: document.getElementById("refresh"),
  list: document.getElementById("proposals"),
  count: document.getElementById("count"),
  status: document.getElementById("status-line"),
};

function setStatus(text, kind) {
  els.status.textContent = text || "";
  els.status.className = kind || "";
}

function fmtScore(s) {
  if (typeof s !== "number") return "—";
  return s.toFixed(2);
}

function fmtTime(unix) {
  if (!unix) return "";
  const d = new Date(unix * 1000);
  return d.toLocaleString();
}

function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;",
  }[c]));
}

function renderProposal(p) {
  const reason = p.llm_reason ? escapeHTML(p.llm_reason) : "<span style='color:#bbb'>no reason</span>";
  return `
    <div class="proposal" data-id="${p.id}">
      <div class="proposal-header">
        <span class="score-pill">trgm ${fmtScore(p.score)}</span>
        <span class="reason">${reason}</span>
        <span>${fmtTime(p.created_at_unix)}</span>
      </div>
      <div class="pair">
        <div class="side winner">
          <div class="label">保留 (winner)</div>
          <div class="name">${escapeHTML(p.winner_name) || "<em style='color:#aaa'>(missing concept)</em>"}</div>
          <div class="meta">use ${p.winner_use_count} · ${p.winner_id.slice(0, 8)}</div>
        </div>
        <div class="arrow">&larr;</div>
        <div class="side loser">
          <div class="label">合并 (loser)</div>
          <div class="name">${escapeHTML(p.loser_name) || "<em style='color:#aaa'>(missing concept)</em>"}</div>
          <div class="meta">use ${p.loser_use_count} · ${p.loser_id.slice(0, 8)}</div>
        </div>
      </div>
      <div class="actions">
        <button class="reject" data-action="reject" data-id="${p.id}">拒绝</button>
        <button class="approve" data-action="approve" data-id="${p.id}">批准合并</button>
      </div>
    </div>
  `;
}

async function load() {
  setStatus("加载中…");
  els.refresh.disabled = true;
  try {
    const resp = await fetch(ENDPOINT);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const body = await resp.json();
    const items = Array.isArray(body.items) ? body.items : [];
    els.count.textContent = items.length;
    if (items.length === 0) {
      els.list.innerHTML = "<div class='empty'>暂无待审 proposal。</div>";
    } else {
      els.list.innerHTML = items.map(renderProposal).join("");
    }
    setStatus("");
  } catch (err) {
    setStatus("加载失败：" + err.message, "err");
  } finally {
    els.refresh.disabled = false;
  }
}

async function decide(id, action) {
  const card = document.querySelector(`.proposal[data-id="${id}"]`);
  if (!card) return;
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  setStatus(action === "approve" ? "正在合并…" : "正在拒绝…");
  try {
    const resp = await fetch(`${ENDPOINT}/${encodeURIComponent(id)}/${action}`, { method: "POST" });
    if (resp.status === 409) {
      setStatus("此 proposal 已被其他管理员处理，正在刷新…", "err");
      await load();
      return;
    }
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    card.style.transition = "opacity .25s, transform .25s";
    card.style.opacity = "0";
    card.style.transform = "translateX(40px)";
    setTimeout(() => { card.remove(); decrementCount(); }, 250);
    setStatus(action === "approve" ? "已合并 ✓" : "已拒绝", "ok");
  } catch (err) {
    setStatus(action + " 失败：" + err.message, "err");
    card.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

function decrementCount() {
  const n = Math.max(0, parseInt(els.count.textContent, 10) - 1);
  els.count.textContent = n;
  if (n === 0) {
    els.list.innerHTML = "<div class='empty'>暂无待审 proposal。</div>";
  }
}

els.refresh.addEventListener("click", load);
els.list.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  decide(btn.dataset.id, btn.dataset.action);
});

load();
</script>
</body>
</html>
